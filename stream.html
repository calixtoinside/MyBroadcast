<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStudio - Painel do Host</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --bg-card: #232332;
            --accent-purple: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2e40;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-purple);
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: var(--bg-secondary);
            text-align: center;
            padding: 20px;
        }

        .controls-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger { background: var(--danger); }

        .input-text {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .channel-info {
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .filter-sepia { filter: sepia(0.6); }
        .filter-bw { filter: grayscale(1); }
        .filter-contrast { filter: contrast(1.3); }
    </style>
</head>
<body>

    <header>
        <div class="brand">Painel de Transmissão 🔴</div>
    </header>

    <div class="container">
        <div class="video-wrapper">
            <div class="video-placeholder" id="placeholder">
                <p>Câmera desligada. Clique em Iniciar Transmissão.</p>
            </div>
            <video id="localVideo" autoplay playsinline muted style="display: none;"></video>
        </div>

        <div class="channel-info">
            Status: <span id="connectionStatus" style="color: var(--text-muted);">Offline</span>
        </div>

        <div class="controls-bar">
            <button class="btn" id="btnToggleLive" onclick="toggleLive()">
                📹 Iniciar Transmissão
            </button>

            <select id="filterSelect" onchange="changeFilter()" class="input-text" style="cursor: pointer;">
                <option value="none">Sem Filtro</option>
                <option value="filter-contrast">Vibrante</option>
                <option value="filter-bw">Preto & Branco</option>
                <option value="filter-sepia">Sépia</option>
            </select>
        </div>
    </div>

    <script>
        const CHANNEL_ID = "meu-canal-principal";
        let peer = null;
        let localStream = null;
        let isLive = false;

        const localVideo = document.getElementById('localVideo');
        const placeholder = document.getElementById('placeholder');
        const btnToggleLive = document.getElementById('btnToggleLive');
        const connectionStatus = document.getElementById('connectionStatus');

        async function toggleLive() {
            if (!isLive) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    localVideo.srcObject = localStream;
                    localVideo.style.display = 'block';
                    placeholder.style.display = 'none';

                    // Inicialização segura compatível com HTTPS do GitHub Pages
                    peer = new Peer(CHANNEL_ID, {
                        host: '0.peerjs.com',
                        port: 443,
                        secure: true
                    });

                    peer.on('open', () => {
                        isLive = true;
                        connectionStatus.textContent = "AO VIVO! Canal transmitindo.";
                        connectionStatus.style.color = "var(--danger)";
                        btnToggleLive.textContent = "⏹ Encerrar Transmissão";
                        btnToggleLive.className = "btn btn-danger";
                    });

                    peer.on('error', (err) => {
                        console.error(err);
                        alert('Erro ao iniciar. Verifique se o canal já não está aberto em outra aba.');
                        stopLive();
                    });

                    peer.on('call', (call) => {
                        call.answer(localStream);
                    });

                } catch (err) {
                    alert('Permissão de câmera/microfone negada.');
                }
            } else {
                stopLive();
            }
        }

        function stopLive() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();

            localVideo.srcObject = null;
            localVideo.style.display = 'none';
            placeholder.style.display = 'flex';

            isLive = false;
            connectionStatus.textContent = "Offline";
            connectionStatus.style.color = "var(--text-muted)";
            btnToggleLive.textContent = "📹 Iniciar Transmissão";
            btnToggleLive.className = "btn";
        }

        function changeFilter() {
            const filter = document.getElementById('filterSelect').value;
            localVideo.className = filter !== 'none' ? filter : '';
        }
    </script>
</body>
</html>
