<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCarly.com - Ao Vivo</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --accent-purple: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2e40;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .brand-logo {
            width: 12px;
            height: 12px;
            background: var(--accent-purple);
            border-radius: 50%;
        }

        .status-pill {
            background: rgba(156, 163, 175, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(156, 163, 175, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
        }

        .status-pill.live {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-pill.live .status-dot {
            background-color: var(--danger);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: var(--bg-secondary);
            gap: 8px;
            text-align: center;
            padding: 20px;
        }

        .overlay-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mute { top: 12px; left: 12px; }
        .btn-fullscreen { bottom: 12px; right: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <span>iCarly.com - Ao Vivo</span>
        </div>
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">OFFLINE</span>
        </div>
    </header>

    <div class="container">
        <div class="video-wrapper" id="videoContainer">
            <button class="overlay-btn btn-mute" id="muteBtn" onclick="toggleMute()">🔊 Som</button>
            <button class="overlay-btn btn-fullscreen" onclick="toggleFullscreen()">⛶ Expandir</button>

            <div class="video-placeholder" id="videoPlaceholder">
                <p id="placeholderText">Conectando à transmissão ao vivo...</p>
            </div>
            
            <video id="remoteVideo" autoplay playsinline style="display: none;"></video>
        </div>
    </div>

    <script>
        const CHANNEL_ID = "meu-canal-principal";
        const remoteVideo = document.getElementById('remoteVideo');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const placeholderText = document.getElementById('placeholderText');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const muteBtn = document.getElementById('muteBtn');

        function toggleMute() {
            remoteVideo.muted = !remoteVideo.muted;
            muteBtn.textContent = remoteVideo.muted ? "🔇 Muted" : "🔊 Som";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (videoContainer.requestFullscreen) videoContainer.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Conectar automaticamente ao canal do Host
        window.addEventListener('load', () => {
            const viewerPeer = new Peer();

            viewerPeer.on('open', () => {
                const emptyStream = new MediaStream();
                const call = viewerPeer.call(CHANNEL_ID, emptyStream);

                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.style.display = 'block';
                    videoPlaceholder.style.display = 'none';
                    statusPill.classList.add('live');
                    statusText.textContent = 'AO VIVO';
                });

                call.on('close', () => {
                    resetState("A transmissão foi encerrada.");
                });

                call.on('error', () => {
                    resetState("O streamer está offline no momento.");
                });
            });

            viewerPeer.on('error', () => {
                resetState("O streamer está offline no momento.");
            });
        });

        function resetState(msg) {
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            videoPlaceholder.style.display = 'flex';
            placeholderText.textContent = msg;
            statusPill.classList.remove('live');
            statusText.textContent = 'OFFLINE';
        }
    </script>
</body>
</html>
